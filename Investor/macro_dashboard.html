<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta charset="UTF-8" />
  <title>Investor</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .diary-container {
      max-width: 1200px;
      margin: 2em auto;
      padding: 1em;
      text-align: center
    }

    .diary-entry {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1em;
      margin-bottom: 1.5em;
      background-color: #fff;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.05);
    }

    .diary-entry h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #333;
    }

    .diary-entry p {
      font-size: 1em;
      line-height: 1.6em;
      color: #444;
    }

    .diary-main-logo {
        text-align: left;
        margin-left: 1em;
        margin-top: 1em;
        padding-top: 1em;
        height: 100px;
    }

    .back-arrow {
      position: fixed;
      top: 25px;   /* more space from the top */
      left: 25px;  /* more space from the left */
      text-decoration: none;
      cursor: pointer;
    }

    .back-arrow svg {
      width: 28px;
      height: 28px;
    }

    .back-arrow:hover { opacity: 0.7; }
    .macro-status { color: #666; margin-bottom: 1.5em; }
    .macro-table { width: 100%; border-collapse: collapse; text-align: left; }
    .macro-table th, .macro-table td { padding: 0.7em; border-bottom: 1px solid #ddd; }
    .macro-table th { color: #333; }
    .macro-table td:nth-child(n+3), .macro-table th:nth-child(n+3) { text-align: right; }
    .return-positive { color: #16803c; }
    .return-negative { color: #b42318; }
    .data-stale { color: #9a6700; }
    .data-error { color: #b42318; }
    .macro-chart { width: 100%; min-height: 300px; display: block; margin-top: 1em; }
    .interactive-chart { min-height: 300px; }
    .asset-view { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 1.5em; align-items: start; margin: 2em 0; padding: 1em 0; border-top: 1px solid #ddd; }
    .sample-table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    .sample-table th, .sample-table td { padding: 0.45em 0.35em; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
    .sample-table th { color: #333; }
    .sample-table td:last-child, .sample-table th:last-child { text-align: right; }
    @media (max-width: 800px) { .asset-view { grid-template-columns: 1fr; } }
    .comparison-chart { margin-bottom: 2em; }
  </style>
</head>
<body>

  <a href="../index.html" class="back-arrow">
    <svg width="28" height="28" viewBox="0 0 24 24">
      <path d="M15 6l-6 6 6 6" stroke="black" stroke-width="2" fill="none" />
    </svg>
  </a>

  <div class="diary-container">

    <h1>Global Macro Dashboard</h1>
    <p id="macro-status" class="macro-status">Loading market data…</p>
    <div class="diary-entry comparison-chart">
      <h2>Cross-market comparison</h2>
      <img src="../data/charts/comparison.png" class="macro-chart" alt="One-year macro cross-market comparison" />
    </div>
    <div class="diary-entry">
      <table class="macro-table">
        <thead><tr><th>Market</th><th>Signal</th><th>Latest</th><th>1D%</th><th>1W%</th><th>1M%</th><th>As of</th></tr></thead>
        <tbody id="macro-rows"></tbody>
      </table>
    </div>
    <div id="asset-charts"></div>
    
  </div>

  <footer>
    <img src="../image/broken_compass.jpg" alt="Small Logo" class="small-logo">
    <!-- <div class="site-name">MySiteName</div> -->
  </footer>
  <script>
    const numberFormatter = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
    const percentFormatter = new Intl.NumberFormat("en-US", { signDisplay: "always", maximumFractionDigits: 2 });
    function formatReturn(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
      const className = Number(value) > 0 ? "return-positive" : Number(value) < 0 ? "return-negative" : "";
      return `<span class="${className}">${percentFormatter.format(Number(value))}%</span>`;
    }
    fetch("../data/macro.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => {
        const rows = document.getElementById("macro-rows");
        const assetCharts = document.getElementById("asset-charts");
        for (const item of data.series) {
          if (!item.latest) continue;
          const row = document.createElement("tr");
          if (item.status === "cached") row.className = "data-stale";
          const returns = item.returns || {};
          row.innerHTML = `<td>${item.market}</td><td>${item.signal}</td>` +
            `<td>${numberFormatter.format(item.latest.value)} <small>${item.unit}</small></td>` +
            `<td>${formatReturn(returns["1D"])}</td>` +
            `<td>${formatReturn(returns["1W"])}</td>` +
            `<td>${formatReturn(returns["1M"])}</td>` +
            `<td>${item.latest.date}${item.status === "cached" ? " (cached)" : ""}</td>`;
          rows.appendChild(row);
          const points = item.history || [];
          const view = document.createElement("div");
          view.className = "asset-view";
          const sampleTable = document.createElement("table");
          sampleTable.className = "sample-table";
          sampleTable.innerHTML = "<thead><tr><th>Age</th><th>Target</th><th>Observed</th><th>Value</th></tr></thead>";
          const sampleBody = document.createElement("tbody");
          const endDate = new Date(`${data.period.end}T00:00:00Z`);
          for (const age of [0, 1, 2, 3, 4, 5, 10, 15, 20, 30, 45, 60, 90]) {
            const targetDate = new Date(endDate);
            targetDate.setUTCDate(targetDate.getUTCDate() - age);
            const target = targetDate.toISOString().slice(0, 10);
            const observed = points.filter(point => point.date <= target).at(-1);
            if (!observed) continue;
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${age}d</td><td>${target}</td><td>${observed.date}</td><td>${Number(observed.value).toFixed(4)}</td>`;
            sampleBody.appendChild(tr);
          }
          sampleTable.appendChild(sampleBody);
          const chart = document.createElement("img");
          chart.className = "macro-chart";
          chart.src = `../data/charts/${item.chart}`;
          chart.alt = `${item.market} one-year history`;
          view.appendChild(sampleTable);
          view.appendChild(chart);
          assetCharts.appendChild(view);
        }
        document.getElementById("macro-status").textContent =
          `Updated ${new Date(data.generated_at).toLocaleString()} · ${data.fresh_series}/${data.total_series} series fetched`;
      })
      .catch(error => {
        const status = document.getElementById("macro-status");
        status.className = "macro-status data-error";
        status.textContent = `Market data is temporarily unavailable (${error.message}).`;
      });
  </script>

</body>
</html>
