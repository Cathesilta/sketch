<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta charset="UTF-8" />
  <title>Investor</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .diary-container {
      max-width: 800px;
      margin: 2em auto;
      padding: 1em;
      text-align: center
    }

    .diary-entry {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1em;
      margin-bottom: 1.5em;
      background-color: #fff;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.05);
    }

    .diary-entry h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #333;
    }

    .diary-entry p {
      font-size: 1em;
      line-height: 1.6em;
      color: #444;
    }

    .diary-main-logo {
        text-align: left;
        margin-left: 1em;
        margin-top: 1em;
        padding-top: 1em;
        height: 100px;
    }

    .back-arrow {
      position: fixed;
      top: 25px;   /* more space from the top */
      left: 25px;  /* more space from the left */
      text-decoration: none;
      cursor: pointer;
    }

    .back-arrow svg {
      width: 28px;
      height: 28px;
    }

    .back-arrow:hover { opacity: 0.7; }
    .macro-status { color: #666; margin-bottom: 1.5em; }
    .macro-table { width: 100%; border-collapse: collapse; text-align: left; }
    .macro-table th, .macro-table td { padding: 0.7em; border-bottom: 1px solid #ddd; }
    .macro-table th { color: #333; }
    .macro-table td:nth-child(3), .macro-table th:nth-child(3) { text-align: right; }
    .data-stale { color: #9a6700; }
    .data-error { color: #b42318; }
    .macro-chart { width: 100%; min-height: 300px; display: block; margin-top: 1em; }
    .interactive-chart { min-height: 300px; }
    .comparison-chart { margin-bottom: 2em; }
  </style>
</head>
<body>

  <a href="../index.html" class="back-arrow">
    <svg width="28" height="28" viewBox="0 0 24 24">
      <path d="M15 6l-6 6 6 6" stroke="black" stroke-width="2" fill="none" />
    </svg>
  </a>

  <div class="diary-container">

    <h1>Global Macro Dashboard</h1>
    <p id="macro-status" class="macro-status">Loading market data…</p>
    <div class="diary-entry comparison-chart">
      <h2>Cross-market comparison</h2>
      <div id="comparison-chart" class="macro-chart" aria-label="One-year macro cross-market comparison"></div>
    </div>
    <div class="diary-entry">
      <table class="macro-table">
        <thead><tr><th>Market</th><th>Signal</th><th>Latest</th><th>As of</th></tr></thead>
        <tbody id="macro-rows"></tbody>
      </table>
    </div>
    
  </div>

  <footer>
    <img src="../image/broken_compass.jpg" alt="Small Logo" class="small-logo">
    <!-- <div class="site-name">MySiteName</div> -->
  </footer>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script>
    const numberFormatter = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
    fetch("../data/macro.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => {
        const rows = document.getElementById("macro-rows");
        for (const item of data.series) {
          if (!item.latest) continue;
          const row = document.createElement("tr");
          if (item.status === "cached") row.className = "data-stale";
          row.innerHTML = `<td>${item.market}</td><td>${item.signal}</td>` +
            `<td>${numberFormatter.format(item.latest.value)} <small>${item.unit}</small></td>` +
            `<td>${item.latest.date}${item.status === "cached" ? " (cached)" : ""}</td>`;
          rows.appendChild(row);
          const chart = document.createElement("div");
          chart.className = "macro-chart interactive-chart";
          chart.setAttribute("role", "img");
          chart.setAttribute("aria-label", `${item.market} one-year history`);
          const chartRow = document.createElement("tr");
          const chartCell = document.createElement("td");
          chartCell.colSpan = 4;
          chartCell.appendChild(chart);
          chartRow.appendChild(chartCell);
          rows.appendChild(chartRow);
          const points = item.history || [];
          Plotly.newPlot(chart, [{
            x: points.map(point => point.date),
            y: points.map(point => point.value),
            type: "scatter", mode: "lines+markers", name: item.column,
            line: { width: 2 }, marker: { size: 4 },
            hovertemplate: "%{x|%d %b %Y}<br>%{y:.4f} " + item.unit + "<extra></extra>"
          }], {
            title: { text: `${item.market} — ${item.signal}`, x: 0, xanchor: "left", font: { size: 14 } },
            margin: { l: 60, r: 20, t: 45, b: 55 }, height: 300,
            xaxis: { title: "Date", rangeslider: { visible: true } },
            yaxis: { title: item.unit }, hovermode: "x unified",
            paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)"
          }, { responsive: true, displaylogo: false });
        }
        const comparisonTraces = data.series.filter(item => item.history && item.history.length).map(item => {
          const first = item.history[0].value;
          return {
            x: item.history.map(point => point.date),
            y: item.history.map(point => point.value / first * 100),
            type: "scatter", mode: "lines", name: item.column,
            hovertemplate: "%{x|%d %b %Y}<br>%{y:.2f} (start = 100)<extra></extra>"
          };
        });
        Plotly.newPlot("comparison-chart", comparisonTraces, {
          margin: { l: 60, r: 20, t: 20, b: 55 }, height: 430,
          xaxis: { title: "Date", rangeslider: { visible: true } },
          yaxis: { title: "Rebased level" }, hovermode: "x unified",
          legend: { orientation: "h", y: -0.25 },
          paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)"
        }, { responsive: true, displaylogo: false });
        document.getElementById("macro-status").textContent =
          `Updated ${new Date(data.generated_at).toLocaleString()} · ${data.fresh_series}/${data.total_series} series fetched`;
      })
      .catch(error => {
        const status = document.getElementById("macro-status");
        status.className = "macro-status data-error";
        status.textContent = `Market data is temporarily unavailable (${error.message}).`;
      });
  </script>

</body>
</html>
