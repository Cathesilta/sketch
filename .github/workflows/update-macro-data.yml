name: Update macro dashboard data
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-macro-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macro.txt
      - run: python -m pip install -r requirements-macro.txt
      - name: Fetch macro data and charts
        env:
          REQUIRE_FRESH_FRED: "1"
        run: python script/fetch_marcro.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- data/macro.json data/charts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro.json data/charts
          git commit -m "Update macro dashboard data"
          git push
